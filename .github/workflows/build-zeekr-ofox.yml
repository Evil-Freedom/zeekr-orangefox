name: Build OrangeFox for zeekr (A16 + Legacy)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: '要编译的目标：zeekr(安卓16) / zeekr14(老版V-3.1世代) / both(全部)'
        type: choice
        default: zeekr
        options:
          - zeekr
          - zeekr14
          - both
  push:
    branches: [main, master]
    paths:
      - 'device/**'
      - 'scripts/**'
      - '**.mk'
      - '!README.md'

concurrency:
  group: ofox-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_16: zeekr
  DEVICE_14: zeekr-14
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8475.git
  # ccache 不使用 actions/cache: 该步骤会把恢复目标目录搞成只读挂载,
  # 导致 ccache 建 tmp 失败 (Read-only file system)。GITHUB_WORKSPACE 本身也是只读 checkout。
  # 正确做法: 编译步骤内 export CCACHE_DIR="$RUNNER_TEMP/.ccache"
  # (RUNNER_TEMP=/home/runner/work/_temp, step 内可用的可写 shell 变量, 每 job 全新)。

jobs:
  build-android16:
    name: "安卓16 新版 OrangeFox (zeekr)"
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_target == 'both' || github.event.inputs.build_target == 'zeekr') || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    # GitHub 托管 runner 单 job 硬上限 6 小时(360分钟)，写 600 无效。
    # 设 345 让 job 在被强杀前自己超时退出，这样后面的日志/缓存步骤还能跑。
    timeout-minutes: 345
    steps:
      - name: 检出设备树仓库
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: 释放磁盘空间
        run: |
          echo "===== 清理前 ====="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/graalvm \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "===== 清理后 ====="
          df -h /

      - name: 创建 swap 防 OOM
        run: |
          # runner 只有 7GB 内存，安卓16 的 soong 分析阶段峰值远超这个数，
          # 上一次构建就是 soong_build 自举完成后静默 OOM，runner 被回收(exit 143)。
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 python3-pip openjdk-17-jdk repo sshpass
          sudo apt-get clean

      # 不使用 actions/cache 缓存 ccache: 该步骤会把恢复目标目录搞成只读挂载，
      # 导致 ccache 建 tmp 失败（Read-only file system）。ccache 改放 RUNNER_TEMP
      # （/home/runner/work/_temp，每 job 全新且可写），牺牲跨 run 缓存加速换确定性。
      # 也不缓存 fox16 源码树: 全量 989 project 约 88G, 远超 GitHub cache 10G 上限,
      # 保存时 zstd 压缩会直接写爆磁盘(实测 ENOSPC)。

      - name: 同步 OrangeFox 16.0 源码
        run: |
          # 不使用 orangefox_sync.sh: 其内部 repo sync 无参数(并发4、全引用、tags),
          # 989 个 project 从零拉 2.5h 拉不完(实测超时被杀)。
          # 改为直接 repo init + 加速 repo sync:
          #   -c 只拉当前分支 / -j8 并发 4->8 / --no-tags 跳过 tags / --optimized-fetch
          #   复用已有对象 / --prune 清理。
          # 16.0 分支的 manifest 补丁脚本中为空操作(BASE_VER=16 走 : 分支), 无需补丁。
          # 同步完成后删除 .repo (对象库 40-60G): 编译不需要它, 只占磁盘。
          mkdir -p "$HOME/fox16"
          cd "$HOME/fox16"
          if [ ! -d .repo ]; then
            repo init --depth=1 -u https://github.com/OrangeFox16/platform_manifest_twrp_aosp.git -b twrp-16
          fi
          # 自更新 repo(确保支持 --optimized-fetch); 失败不影响继续(用系统 repo 兜底)
          repo selfupdate 2>/dev/null || true
          set -o pipefail
          repo sync -c -j8 --no-tags --optimized-fetch --prune 2>&1 | tee /tmp/repo_sync16.log | tail -80
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "❌ repo sync 失败 exit=$rc (详见 /tmp/repo_sync16.log)"
            exit "$rc"
          fi
          test -f build/envsetup.sh || { echo "❌ 同步后 build/envsetup.sh 仍缺失"; exit 1; }
          # 释放 .repo 对象库, 给编译 out/ 腾磁盘
          du -sh .repo 2>/dev/null || true
          rm -rf .repo
          df -h /
        timeout-minutes: 150

      # 不再克隆/编译内核：设备树自带 prebuilt/kernel，且与 recovery/root 下那批
      # .ko 是同一次编译产出的。源码编译出来的内核 vermagic 不同，那些 .ko 会全部
      # 拒载，msm_drm.ko 加载不上就是黑屏。顺带省掉 30-60 分钟和一大块磁盘。

      - name: 部署设备树
        run: |
          cd "$HOME/fox16"
          mkdir -p device/motorola
          cp -r "$GITHUB_WORKSPACE/device_tree/device/motorola/${{ env.DEVICE_16 }}" device/motorola/
          D="device/motorola/${{ env.DEVICE_16 }}"
          # 这三样缺一个，编出来的 img 要么起不来要么黑屏，早失败好过编完才发现
          test -s "$D/prebuilt/kernel" || { echo "❌ prebuilt/kernel 缺失或为空"; exit 1; }
          test -f "$D/recovery/root/vendor/lib/modules/msm_drm.ko" || { echo "❌ 显示驱动 msm_drm.ko 缺失"; exit 1; }
          test -f "$D/recovery/root/init.recovery.qcom.rc" || { echo "❌ init.recovery.qcom.rc 缺失"; exit 1; }
          echo "✅ 内核 $(stat -c%s "$D/prebuilt/kernel") 字节，模块 $(ls "$D/recovery/root/vendor/lib/modules/"*.ko | wc -l) 个"

      - name: 编译 OrangeFox (安卓16)
        run: |
          cd "$HOME/fox16"
          test -f build/envsetup.sh || { echo "❌ build/envsetup.sh 不存在，源码同步失败"; ls -la "$HOME/fox16" | head -30; exit 1; }
          # out/ 放独立目录 ~/fox16-out, 与源码树分离, 便于磁盘管理; 每次全新。
          export OUT_DIR="$HOME/fox16-out"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          # Android 16 soong sandbox 默认把源码树挂成只读, ccache 写临时文件
          # (与源码树同分区) 会撞 "Read-only file system" (ninja 编译阶段才报)。
          # AOSP 官方开关: BUILD_BROKEN_SRC_DIR_IS_WRITABLE=true 构建期整个源码树可写。
          # BoardConfig.mk 已加同值, 这里 export 环境变量双保险 (soong_ui 从 env 读取)。
          export BUILD_BROKEN_SRC_DIR_IS_WRITABLE=true
          # /tmp 不在 soong sandbox 范围内，绝对可写。RUNNER_TEMP 仍会被挂只读。
          export CCACHE_DIR="/tmp/.ccache"
          mkdir -p "$CCACHE_DIR" && chmod 777 "$CCACHE_DIR"
          export USE_CCACHE=1
          export CCACHE_EXEC=$(command -v ccache)
          ccache -M 6G
          ccache -z
          source build/envsetup.sh
          export FOX_BUILD_DEVICE=zeekr
          lunch twrp_${{ env.DEVICE_16 }}-bp2a-eng || lunch twrp_${{ env.DEVICE_16 }}-eng
          set -eo pipefail
          mka recoveryimage 2>&1 | tee /tmp/build16.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then echo "❌ mka recoveryimage 失败 exit=$rc"; exit "$rc"; fi
          df -h /
        timeout-minutes: 170

      - name: 构建后状态 (诊断用)
        if: always()
        run: |
          echo "===== 磁盘 ====="; df -h /
          echo "===== 内存/swap ====="; free -h
          echo "===== ccache ====="; ccache -s || true

      - name: 收集产物
        if: always()
        run: |
          # out/ 已外置到 ~/fox16-out (编译步骤 export OUT_DIR)
          OUT="$HOME/fox16-out/target/product/${{ env.DEVICE_16 }}"
          echo "===== 产物目录 ====="
          ls -la "$OUT" 2>/dev/null | head -50
          mkdir -p "$GITHUB_WORKSPACE/artifacts/zeekr-a16"
          find "$OUT" -maxdepth 1 -name 'OrangeFox-*.zip' -exec cp {} "$GITHUB_WORKSPACE/artifacts/zeekr-a16/" \; 2>/dev/null || true
          cp "$OUT/recovery.img" "$GITHUB_WORKSPACE/artifacts/zeekr-a16/" 2>/dev/null || true
          # 失败时也把日志带出来，否则下次还是瞎猜
          cp /tmp/build16.log "$GITHUB_WORKSPACE/artifacts/zeekr-a16/" 2>/dev/null || true
          cp /tmp/repo_sync16.log "$GITHUB_WORKSPACE/artifacts/zeekr-a16/" 2>/dev/null || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-zeekr-Android16
          path: artifacts/zeekr-a16/
          if-no-files-found: warn

  build-legacy:
    name: "老版 OrangeFox (fox_14.1, V-3.1世代)"
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_target == 'both' || github.event.inputs.build_target == 'zeekr14') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 345
    steps:
      - name: 检出设备树仓库
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/graalvm \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: 创建 swap 防 OOM
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 python3-pip openjdk-17-jdk repo sshpass
          sudo apt-get clean

      # 不使用 actions/cache 缓存 ccache: 同上，恢复目标目录会变只读挂载。
      # ccache 放 RUNNER_TEMP，每 job 全新可写。

      - name: 同步 OrangeFox 14.1 源码
        run: |
          mkdir -p "$HOME/fox14"
          cd "$HOME"
          git clone https://gitlab.com/OrangeFox/sync.git fox14_sync
          cd fox14_sync
          ./orangefox_sync.sh --branch 14.1 --path "$HOME/fox14" || \
            ./orangefox_sync.sh --branch 14.1 --path "$HOME/fox14"
          df -h /
        timeout-minutes: 150

      - name: 克隆内核 (安卓14 lineage-21)
        run: |
          cd "$HOME/fox14"
          mkdir -p kernel/motorola
          git clone --depth=1 --branch lineage-21 "$KERNEL_REPO" kernel/motorola/sm8475

      - name: 部署设备树
        run: |
          cd "$HOME/fox14"
          mkdir -p device/motorola
          # 目录名必须保持 zeekr-14：twrp_zeekr14.mk 的 PRODUCT_DEVICE 已改成 zeekr-14，
          # 构建系统靠目录名定位 BoardConfig.mk，改名就会 Invalid lunch combo。
          cp -r "$GITHUB_WORKSPACE/device_tree/device/motorola/${{ env.DEVICE_14 }}" device/motorola/
          ls -la device/motorola/

      - name: 编译 OrangeFox (老版)
        run: |
          cd "$HOME/fox14"
          export CCACHE_DIR="/tmp/.ccache"
          mkdir -p "$CCACHE_DIR" && chmod 777 "$CCACHE_DIR"
          export USE_CCACHE=1
          export CCACHE_EXEC=$(command -v ccache)
          ccache -M 12G
          ccache -z
          source build/envsetup.sh
          export FOX_BUILD_DEVICE=zeekr
          lunch twrp_zeekr14-ap2a-eng || lunch twrp_zeekr14-eng
          set -eo pipefail
          mka recoveryimage 2>&1 | tee /tmp/build14.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then echo "❌ mka recoveryimage 失败 exit=$rc"; exit "$rc"; fi
        timeout-minutes: 170

      - name: 构建后状态 (诊断用)
        if: always()
        run: |
          echo "===== 磁盘 ====="; df -h /
          echo "===== 内存/swap ====="; free -h
          echo "===== ccache ====="; ccache -s || true

      - name: 收集产物
        if: always()
        run: |
          # 产物目录取自 PRODUCT_DEVICE(zeekr-14)，原先误用 DEVICE_16 导致永远找不到产物
          OUT="$HOME/fox14/out/target/product/${{ env.DEVICE_14 }}"
          echo "===== 产物目录 ====="
          ls -la "$OUT" 2>/dev/null | head -50
          mkdir -p "$GITHUB_WORKSPACE/artifacts/zeekr-legacy"
          find "$OUT" -maxdepth 1 -name 'OrangeFox-*.zip' -exec cp {} "$GITHUB_WORKSPACE/artifacts/zeekr-legacy/" \; 2>/dev/null || true
          cp "$OUT/recovery.img" "$GITHUB_WORKSPACE/artifacts/zeekr-legacy/" 2>/dev/null || true
          cp /tmp/build14.log "$GITHUB_WORKSPACE/artifacts/zeekr-legacy/" 2>/dev/null || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-zeekr-Legacy14
          path: artifacts/zeekr-legacy/
          if-no-files-found: warn
